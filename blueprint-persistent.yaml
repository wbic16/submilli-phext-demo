kind: blueprint
name: phext-demo-persistent
allow_insecure_http: false        # Route B needs no network at all

variables:
  phextId: { required: true }
  lane:    { required: true }     # e.g. "1.1.1/1.2.1" — bound by the app

packages:
- '@wbic16/phext'

# Stage 2 storage: same per_session root as blueprint.yaml, but the
# operator-declared named volume "phext-memory" is grafted at guest path
# /phext, so the package's /phext/<id>.phext files live on the volume —
# across sessions and server restarts, never auto-deleted. The volume is
# declared in the server config (see README Act 6):
#   volumes:
#     phext-memory: { kind: managed-local, size_limit: 1GB }
# On disk it is <volume_dir>/managed-local/phext-memory/, and the mount
# makes that directory the guest's /phext, so demo.phext lands at
# managed-local/phext-memory/demo.phext.
vfs:
  mode: per_session
  mounts:
    /phext:
      mode: named
      volume: phext-memory
      access: read_write

default: deny
permissions:
  main:
  - capability: phext.example/toc.read
    filter: phextId == ${vars.phextId}
    action: allow
  - capability: phext.example/scrolls.select
    filter: phextId == ${vars.phextId} and coordinate glob "1.1.1/1.1.1/*"
    action: allow               # reference lane: read
  - capability: phext.example/scrolls.select
    filter: phextId == ${vars.phextId} and coordinate glob "${vars.lane}/*"
    action: allow               # own lane: read
  - capability: phext.example/scrolls.write
    filter: phextId == ${vars.phextId} and coordinate glob "${vars.lane}/*"
    action: allow               # own lane: write — the only write rule
  - capability: phext.example/checksum.read
    filter: phextId == ${vars.phextId}
    action: allow
  '@wbic16/phext':                # what the package itself may do
  - { capability: fs.mkdir, filter: path == "/phext" and recursive == true, action: allow }
  - { capability: fs.stat,  filter: path == "/phext", action: allow }
    # ^ the package's ensureDir() stats its own directory; glob "/phext/*"
    # does not match "/phext" itself (Stage-1 finding, cf. BUILD-REPORT.md).
    # Guest paths are unchanged by the mount, so neither does this rule set.
  - { capability: fs.read,  filter: path glob "/phext/*", action: allow }
  - { capability: fs.write, filter: path glob "/phext/*", action: allow }
  - { capability: fs.stat,  filter: path glob "/phext/*", action: allow }
